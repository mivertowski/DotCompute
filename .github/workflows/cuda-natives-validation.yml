name: CUDA Natives Validation

# Clean-room proof for the DotCompute.Backends.CUDA.Natives.* packages (GH #187):
# GitHub-hosted runners have NO CUDA Toolkit and no GPU, so a passing run proves the
# packaged cudart + NVRTC resolve through DotCompute's native-library resolver and that
# NVRTC compiles a real kernel to PTX from the package assets alone.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/Backends/DotCompute.Backends.CUDA.Natives/**'
      - 'src/Backends/DotCompute.Backends.CUDA/Types/Native/CudaRuntime.cs'
      - 'tests/CleanRoom/DotCompute.CudaNatives.ValidationApp/**'
      - 'scripts/download-cuda-natives.sh'
      - '.github/workflows/cuda-natives-validation.yml'

env:
  DOTNET_VERSION: '10.0.x'

jobs:
  validate:
    name: ${{ matrix.natives.major }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        natives:
          - { major: CU13, version: 13.0.2 }
          - { major: CU12, version: 12.9.1 }
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NVIDIA redist archives
        uses: actions/cache@v5
        with:
          path: artifacts/cuda-natives-cache
          key: cuda-natives-13.0.2-12.9.1

      - name: Download + verify CUDA redistributables
        shell: bash
        run: ./scripts/download-cuda-natives.sh

      - name: Pack natives package
        shell: bash
        run: dotnet pack src/Backends/DotCompute.Backends.CUDA.Natives/${{ matrix.natives.major }}/DotCompute.Backends.CUDA.Natives.${{ matrix.natives.major }}.csproj -c Release -o artifacts/packages

      - name: Clean-room validation (no toolkit, no GPU)
        shell: bash
        env:
          NATIVES_VALIDATION_EXPECT_PACKAGED: '1'
        run: |
          dotnet run --project tests/CleanRoom/DotCompute.CudaNatives.ValidationApp -c Release \
            -p:NativesMajor=${{ matrix.natives.major }} -p:NativesVersion=${{ matrix.natives.version }}

      - name: Upload package artifact
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: natives-${{ matrix.natives.major }}
          path: artifacts/packages/DotCompute.Backends.CUDA.Natives.*.nupkg
          retention-days: 14
